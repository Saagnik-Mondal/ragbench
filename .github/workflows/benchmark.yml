name: Benchmark

# Runs the full SciFact retrieval benchmark on GitHub's servers and commits the results
# (results/benchmark.json, benchmark.md, benchmark.png) back to the repository.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra bench --python 3.12

      - name: Cache models and dataset
        uses: actions/cache@v4
        with:
          path: |
            .fastembed_cache
            data
          key: ragbench-models-${{ hashFiles('src/ragbench/retrievers.py', 'src/ragbench/data.py') }}

      - name: Run benchmark
        run: uv run python -m ragbench.evaluate

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Add benchmark results" || echo "No changes to commit"
          git pull --rebase origin main
          git push
