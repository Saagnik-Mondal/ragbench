name: Benchmark

# Runs the full SciFact retrieval benchmark on GitHub's servers and saves the results
# (benchmark.json, benchmark.md, benchmark.png) as a downloadable artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra bench --python 3.12

      - name: Cache models and dataset
        uses: actions/cache@v4
        with:
          path: |
            .fastembed_cache
            data
          key: ragbench-models-${{ hashFiles('src/ragbench/retrievers.py', 'src/ragbench/data.py') }}

      - name: Run benchmark
        run: uv run python -m ragbench.evaluate

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
