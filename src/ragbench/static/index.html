<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ragbench</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #fff; --text: #1a1a1a; --muted: #6b6b66; --border: #e3e3de;
    --accent: #2f5bea; --accent-soft: #e8edfd; --mark: #fff3bf;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131315; --surface: #1c1c1f; --text: #ececea; --muted: #9a9a94;
            --border: #2e2e32; --accent: #7b9bff; --accent-soft: #232a45; --mark: #4a4220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 320px; padding: 12px 14px; font: inherit; color: inherit;
         background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  select, button { padding: 12px 16px; font: inherit; border-radius: 10px;
         border: 1px solid var(--border); background: var(--surface); color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .6; cursor: wait; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .examples { margin: 12px 0 28px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft);
          color: var(--accent); border: 0; cursor: pointer; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
          padding: 16px 18px; margin-bottom: 12px; }
  .answer { border-left: 4px solid var(--accent); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .passage h3 { font-size: 15px; margin: 0 0 4px; }
  .passage p { margin: 0; color: var(--muted); font-size: 14px; }
  .idx { display: inline-block; min-width: 22px; text-align: center; font-size: 12px; font-weight: 600;
         background: var(--accent-soft); color: var(--accent); border-radius: 6px; margin-right: 6px; }
  .cited { box-shadow: inset 3px 0 0 var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .grid h4 { margin: 0 0 8px; font-size: 14px; }
  .grid ol { margin: 0; padding-left: 20px; font-size: 13px; }
  .grid li { margin-bottom: 6px; }
  .grid li.shared { color: var(--muted); }
  .err { color: #c0392b; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 10px; }
</style>
</head>
<body>
<main>
  <h1>ragbench</h1>
  <p class="sub">Ask a scientific question. Pick a retrieval strategy, or compare them side by side.</p>
  <form id="f">
    <input id="q" type="text" placeholder="e.g. Does vitamin D reduce the risk of fractures?" required aria-label="Question">
    <select id="s" aria-label="Retrieval strategy"></select>
    <button class="primary" id="ask" type="submit">Ask</button>
    <button type="button" id="cmp">Compare strategies</button>
  </form>
  <div class="examples" id="ex"></div>
  <div id="out"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const out = $("out");
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EXAMPLES = ["Does vitamin D reduce the risk of fractures?", "Aspirin lowers colorectal cancer risk",
                  "Mutations in BRCA1 increase breast cancer risk", "Exercise improves cognitive function in older adults"];

async function post(path, body) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}
function busy(b) { $("ask").disabled = $("cmp").disabled = b; }

function renderAsk(d) {
  const cited = new Set(d.citations);
  const answer = esc(d.answer);
  const passages = d.results.map((p, i) => `
    <div class="card passage ${cited.has(p.doc_id) ? "cited" : ""}">
      <h3><span class="idx">${i + 1}</span>${esc(p.title || "Untitled")}</h3>
      <p>${esc(p.text.length > 320 ? p.text.slice(0, 320) + "…" : p.text)}</p>
      <div class="meta">doc ${esc(p.doc_id)} · score ${p.score.toFixed(3)}</div>
    </div>`).join("");
  out.innerHTML = `
    <h2>Answer</h2>
    <div class="card answer"><div>${answer}</div>
      <div class="meta">${esc(d.backend)} · ${esc(d.strategy)} retrieval · ${d.latency_ms} ms</div></div>
    <h2>Evidence</h2>${passages}`;
}

function renderCompare(res) {
  const counts = {};
  res.forEach(r => r.results.forEach(p => counts[p.doc_id] = (counts[p.doc_id] || 0) + 1));
  const cols = res.map(r => `
    <div class="card"><h4>${esc(r.strategy)} <span class="meta">${r.latency_ms} ms</span></h4>
    <ol>${r.results.map(p => `<li class="${counts[p.doc_id] === res.length ? "shared" : ""}">${esc(p.title || p.doc_id)}</li>`).join("")}</ol></div>`).join("");
  out.innerHTML = `<h2>Top results per strategy</h2><div class="grid">${cols}</div>
    <p class="meta">Greyed items appear in every strategy's top results; the rest are where strategies disagree.</p>`;
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); busy(true); out.innerHTML = "<p class='meta'>Retrieving…</p>";
  try { renderAsk(await post("/ask", {query: $("q").value, strategy: $("s").value, k: 5})); }
  catch (err) { out.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
  busy(false);
});
$("cmp").addEventListener("click", async () => {
  if (!$("q").value.trim()) { $("q").focus(); return; }
  busy(true); out.innerHTML = "<p class='meta'>Running every strategy…</p>";
  try {
    const names = await (await fetch("/strategies")).json();
    renderCompare(await Promise.all(names.map(n => post("/search", {query: $("q").value, strategy: n, k: 5}))));
  } catch (err) { out.innerHTML = `<p class="err">${esc(err.message)}</p>`; }
  busy(false);
});
EXAMPLES.forEach(t => {
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = t;
  b.onclick = () => { $("q").value = t; $("f").requestSubmit(); };
  $("ex").appendChild(b);
});
fetch("/strategies").then(r => r.json()).then(names => {
  $("s").innerHTML = names.map(n => `<option ${n === "hybrid+rerank" || n === "hybrid" ? "selected" : ""}>${esc(n)}</option>`).join("");
  if (names.includes("hybrid+rerank")) $("s").value = "hybrid+rerank";
});
</script>
</body>
</html>
