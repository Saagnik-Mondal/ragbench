name: Benchmark

# Runs the retrieval benchmark on GitHub's servers for a chosen BEIR dataset and saves the
# results (benchmark.json, benchmark.md, benchmark.png) as a downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "BEIR dataset to benchmark"
        type: choice
        default: scifact
        options:
          - scifact
          - nfcorpus

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra bench --python 3.12

      - name: Cache models and dataset
        uses: actions/cache@v4
        with:
          path: |
            .fastembed_cache
            data
          key: ragbench-${{ inputs.dataset }}-v2

      - name: Run benchmark
        run: uv run python -m ragbench.evaluate --dataset ${{ inputs.dataset }}

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ inputs.dataset }}
          path: results/
