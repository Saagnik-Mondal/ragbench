[project]
name = "ragbench"
version = "0.1.0"
description = "A retrieval-augmented QA system that benchmarks its own retrieval strategies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pyarrow>=15",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
bench = ["matplotlib>=3.8"]
calib = ["scikit-learn>=1.4", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "scikit-learn>=1.4"]

[project.scripts]
ragbench-eval = "ragbench.evaluate:main"
ragbench-calibrate = "ragbench.calibrate_eval:main"
ragbench-serve = "ragbench.api:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
